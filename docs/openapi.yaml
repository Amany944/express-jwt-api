openapi: 3.0.3
info:
  title: Express JWT API
  version: 1.0.0
  description: |
    API REST avec authentification JWT (access token + refresh token avec rotation).

    **Utilisation :** appelez `POST /auth/login`, copiez l'`accessToken`,
    cliquez sur **Authorize** et collez-le (sans le préfixe "Bearer").
  license:
    name: MIT
servers:
  - url: /api
    description: Serveur courant

tags:
  - name: Santé
  - name: Authentification
  - name: Utilisateurs

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: string, example: 665f1c2e8b3a4d0012345678 }
        name: { type: string, example: Alice }
        email: { type: string, format: email, example: alice@example.com }
        role: { type: string, enum: [user, admin], example: user }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Tokens:
      type: object
      properties:
        accessToken: { type: string, example: eyJhbGciOiJIUzI1NiIs... }
        refreshToken: { type: string, example: eyJhbGciOiJIUzI1NiIs... }

    AuthResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          allOf:
            - $ref: '#/components/schemas/Tokens'
            - type: object
              properties:
                user: { $ref: '#/components/schemas/User' }

    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Données invalides }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: email }
              message: { type: string, example: Email invalide }

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, example: Alice }
        email: { type: string, format: email, example: alice@example.com }
        password:
          type: string
          minLength: 8
          description: Au moins 8 caractères dont un chiffre
          example: motdepasse1

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: alice@example.com }
        password: { type: string, example: motdepasse1 }

    UpdateUserInput:
      type: object
      properties:
        name: { type: string, example: Alice Martin }
        email: { type: string, format: email }
        role:
          type: string
          enum: [user, admin]
          description: Modifiable uniquement par un admin

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Identifiant MongoDB de l'utilisateur

  responses:
    Unauthorized:
      description: Jeton manquant, invalide ou expiré
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permissions insuffisantes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Données invalides
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /health:
    get:
      tags: [Santé]
      summary: État du serveur
      security: []
      responses:
        '200':
          description: Serveur opérationnel
          content:
            application/json:
              example: { success: true, status: ok, uptime: 12.34 }

  /auth/register:
    post:
      tags: [Authentification]
      summary: Créer un compte
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Compte créé, jetons renvoyés
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Trop de tentatives }

  /auth/login:
    post:
      tags: [Authentification]
      summary: Se connecter
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Email ou mot de passe incorrect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Trop de tentatives }

  /auth/refresh:
    post:
      tags: [Authentification]
      summary: Renouveler les jetons
      security: []
      description: Le refresh token utilisé est invalidé et remplacé (rotation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Nouvelle paire de jetons
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/Tokens' }
        '401':
          description: Refresh token invalide, expiré ou révoqué
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/logout:
    post:
      tags: [Authentification]
      summary: Se déconnecter (révoque le refresh token)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Déconnexion réussie
          content:
            application/json:
              example: { success: true, message: Déconnexion réussie }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Authentification]
      summary: Profil de l'utilisateur connecté
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [Utilisateurs]
      summary: Liste paginée des utilisateurs (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Liste des utilisateurs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  meta:
                    type: object
                    properties:
                      page: { type: integer, example: 1 }
                      limit: { type: integer, example: 10 }
                      total: { type: integer, example: 42 }
                      pages: { type: integer, example: 5 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Utilisateurs]
      summary: Détail d'un utilisateur (admin ou propriétaire)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Utilisateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Utilisateurs]
      summary: Modifier un utilisateur (admin ou propriétaire)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserInput' }
      responses:
        '200':
          description: Utilisateur modifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Email déjà utilisé }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Utilisateurs]
      summary: Supprimer un utilisateur (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Utilisateur supprimé }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
